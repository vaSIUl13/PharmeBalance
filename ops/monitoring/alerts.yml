groups:
  - name: pharmabalance
    rules:
      - alert: PharmaBalanceMetricsUnavailable
        expr: up{job=~"pharmabalance-(api|worker)"} == 0
        for: 5m
        annotations:
          summary: PharmaBalance target {{ $labels.job }} cannot be scraped
      - alert: PharmaBalanceForecastWorkerStalled
        expr: time() - pharmabalance_forecast_last_success_timestamp_seconds > 2700
        for: 10m
        annotations:
          summary: No successful forecast worker cycle in 45 minutes
      - alert: PharmaBalanceSlowForecastCycle
        expr: |
          increase(pharmabalance_forecast_cycle_duration_seconds_count{status="success"}[2h])
            - ignoring(le)
          increase(pharmabalance_forecast_cycle_duration_seconds_bucket{status="success",le="30"}[2h]) > 0
        annotations:
          summary: A forecast worker cycle exceeded 30 seconds in the last two hours
      - alert: PharmaBalanceForecastDataStale
        expr: |
          (time() - pharmabalance_forecast_data_timestamp_seconds > 172800)
            and (pharmabalance_forecast_data_timestamp_seconds > 0)
        for: 10m
        annotations:
          summary: The latest forecast cutoff is more than 48 hours old
