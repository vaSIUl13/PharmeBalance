global:
  scrape_interval: 30s
  evaluation_interval: 30s

rule_files:
  - alerts.yml

scrape_configs:
  - job_name: pharmabalance-api
    metrics_path: /api/v1/metrics
    authorization:
      credentials_file: /run/secrets/pharmabalance_metrics_token
    static_configs:
      - targets: ['api:3001']
  - job_name: pharmabalance-worker
    metrics_path: /metrics
    authorization:
      credentials_file: /run/secrets/pharmabalance_metrics_token
    static_configs:
      - targets: ['worker:9101']
